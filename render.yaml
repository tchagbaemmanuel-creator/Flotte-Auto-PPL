services:
  - type: web
    name: flotte-ppl
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      # À renseigner dans le tableau de bord Render : Environment → MONGODB_URI (secret Atlas)
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: flotte_ppl
